<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Socket.IO Group Chat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .app {
            width: 900px;
            height: 600px;

            margin: 50px auto;

            display: flex;

            background: white;

            border: 1px solid #ddd;
            border-radius: 10px;

            overflow: hidden;
        }

        /* =========================
           SIDEBAR
        ========================== */

        .sidebar {
            width: 250px;

            padding: 20px;

            background: #fafafa;

            border-right: 1px solid #ddd;
        }

        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .connection-status {
            padding: 10px;

            margin-bottom: 20px;

            border-radius: 6px;

            background: #eee;

            font-size: 14px;
        }

        .rooms-title {
            margin-bottom: 10px;

            font-size: 14px;
            font-weight: bold;

            color: #666;
        }

        .room {
            padding: 12px;

            margin-bottom: 8px;

            border-radius: 6px;

            cursor: pointer;

            transition: background 0.2s;
        }

        .room:hover {
            background: #e9e9e9;
        }

        .room.active {
            background: #ddd;
            font-weight: bold;
        }

        .room-actions {
            margin-top: 25px;
        }

        .room-actions button {
            width: 100%;

            padding: 10px;

            margin-bottom: 8px;

            border: none;
            border-radius: 6px;

            cursor: pointer;
        }

        #joinButton {
            background: #222;
            color: white;
        }

        #leaveButton {
            background: #ddd;
            color: #222;
        }


        /* =========================
           CHAT AREA
        ========================== */

        .chat {
            flex: 1;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           CHAT HEADER
        ========================== */

        .chat-header {
            height: 70px;

            padding: 20px;

            display: flex;

            align-items: center;

            border-bottom: 1px solid #ddd;
        }

        .chat-header h2 {
            margin: 0;

            font-size: 20px;
        }


        /* =========================
           MESSAGES
        ========================== */

        .messages {
            flex: 1;

            padding: 20px;

            overflow-y: auto;

            background: #fff;
        }

        .message {
            width: fit-content;

            max-width: 70%;

            margin-bottom: 12px;

            padding: 10px 14px;

            border-radius: 8px;

            background: #f1f1f1;
        }

        .sender {
            margin-bottom: 4px;

            font-size: 12px;

            font-weight: bold;

            color: #666;
        }

        .text {
            font-size: 15px;

            color: #222;

            word-break: break-word;
        }

        .system-message {
            margin-bottom: 12px;

            text-align: center;

            font-size: 12px;

            color: #888;
        }


        /* =========================
           MESSAGE INPUT
        ========================== */

        .message-input {
            padding: 15px;

            display: flex;

            border-top: 1px solid #ddd;
        }

        .message-input input {
            flex: 1;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            outline: none;

            font-size: 14px;
        }

        .message-input input:focus {
            border-color: #888;
        }

        .message-input button {
            margin-left: 10px;

            padding: 12px 20px;

            border: none;

            border-radius: 6px;

            background: #222;

            color: white;

            cursor: pointer;
        }

        .message-input button:hover {
            background: #444;
        }

        .message-input button:disabled {
            background: #aaa;

            cursor: not-allowed;
        }
    </style>

</head>


<body>
   <div class="app">

        <aside class="sidebar">

            <h2>Group Chat</h2>


            <!-- Connection Status -->

            <div id="connectionStatus" class="connection-status">
                🔴 Connecting...
            </div>


            <!-- Rooms -->

            <div class="rooms-title">
                ROOMS
            </div>


            <div class="room" data-room="developers">
                🟢 developers
            </div>


            <div class="room" data-room="testing">
                🔵 testing
            </div>


            <div class="room active" data-room="general">
                🟡 general
            </div>


            <!-- Room Actions -->

            <div class="room-actions">

                <button id="joinButton">
                    Join Room
                </button>

                <button id="leaveButton">
                    Leave Room
                </button>

            </div>

        </aside>



        <!-- =========================
         CHAT
    ========================== -->

        <main class="chat">


            <!-- Chat Header -->

            <header class="chat-header">

                <h2>
                    # <span id="currentRoom">
                        general
                    </span>
                </h2>

            </header>



            <!-- Messages -->

            <section id="messages" class="messages">

                <div class="system-message">
                    Select a room and join to start chatting.
                </div>

            </section>



            <!-- Message Input -->

            <div class="message-input">

                <input id="messageInput" type="text" placeholder="Type a message..." autocomplete="off">

                <button id="sendButton">
                    Send
                </button>

            </div>


        </main>


    </div>



    <!-- =========================
     SOCKET.IO CLIENT
========================== -->

    <script src="http://localhost:3100/socket.io/socket.io.js"></script>


    <script>


        // ==========================================
        // SOCKET CONNECTION
        // ==========================================

        const socket = io('http://localhost:3100');


        // Currently selected room

        let currentRoom = 'general';


        // Whether we are currently inside a room

        let isJoined = false;



        // ==========================================
        // HTML ELEMENTS
        // ==========================================

        const connectionStatus =
            document.getElementById(
                'connectionStatus'
            );


        const currentRoomElement =
            document.getElementById(
                'currentRoom'
            );


        const messagesElement =
            document.getElementById(
                'messages'
            );


        const messageInput =
            document.getElementById(
                'messageInput'
            );


        const sendButton =
            document.getElementById(
                'sendButton'
            );


        const joinButton =
            document.getElementById(
                'joinButton'
            );


        const leaveButton =
            document.getElementById(
                'leaveButton'
            );



        // ==========================================
        // SOCKET CONNECT
        // ==========================================

        socket.on('connect', () => {

            console.log(
                'Socket connected:',
                socket.id
            );


            connectionStatus.textContent =
                '🟢 Connected';


            /*
             * Automatically join the default room
             */

            joinCurrentRoom();

        });



        // ==========================================
        // SOCKET DISCONNECT
        // ==========================================

        socket.on('disconnect', () => {

            console.log(
                'Socket disconnected'
            );


            connectionStatus.textContent =
                '🔴 Disconnected';


            isJoined = false;

        });



        // ==========================================
        // ROOM SELECTION
        // ==========================================

        document
            .querySelectorAll('.room')
            .forEach((roomElement) => {


                roomElement.addEventListener(
                    'click',
                    () => {


                        const newRoom =
                            roomElement.dataset.room;


                        /*
                         * Don't do anything if
                         * clicking current room.
                         */

                        if (
                            newRoom === currentRoom
                        ) {
                            return;
                        }


                        /*
                         * Leave previous room
                         */

                        if (isJoined) {

                            socket.emit(
                                'leave_room',
                                {
                                    roomId: currentRoom
                                }
                            );

                        }


                        /*
                         * Change current room
                         */

                        currentRoom = newRoom;


                        currentRoomElement.textContent =
                            currentRoom;


                        /*
                         * Update active room UI
                         */

                        document
                            .querySelectorAll('.room')
                            .forEach((room) => {

                                room.classList.remove(
                                    'active'
                                );

                            });


                        roomElement.classList.add(
                            'active'
                        );


                        /*
                         * Clear previous messages
                         */

                        messagesElement.innerHTML =
                            '';


                        /*
                         * Join new room
                         */

                        joinCurrentRoom();

                    }
                );

            });



        // ==========================================
        // JOIN CURRENT ROOM
        // ==========================================

        function joinCurrentRoom() {

            if (!socket.connected) {
                return;
            }


            socket.emit(
                'join_room',
                {
                    roomId: currentRoom
                }
            );

        }



        // ==========================================
        // JOIN BUTTON
        // ==========================================

        joinButton.addEventListener(
            'click',
            () => {

                joinCurrentRoom();

            }
        );



        // ==========================================
        // ROOM JOINED EVENT
        // ==========================================

        socket.on(
            'room_joined',
            (data) => {

                isJoined = true;


                addSystemMessage(
                    `You joined #${data.roomId}`
                );


                console.log(
                    'Joined room:',
                    data.roomId
                );

            }
        );



        // ==========================================
        // LEAVE BUTTON
        // ==========================================

        leaveButton.addEventListener(
            'click',
            () => {

                if (!isJoined) {
                    return;
                }


                socket.emit(
                    'leave_room',
                    {
                        roomId: currentRoom
                    }
                );

            }
        );



        // ==========================================
        // ROOM LEFT EVENT
        // ==========================================

        socket.on(
            'room_left',
            (data) => {

                isJoined = false;


                addSystemMessage(
                    `You left #${data.roomId}`
                );


                console.log(
                    'Left room:',
                    data.roomId
                );

            }
        );



        // ==========================================
        // SEND BUTTON
        // ==========================================

        sendButton.addEventListener(
            'click',
            sendMessage
        );



        // ==========================================
        // ENTER KEY
        // ==========================================

        messageInput.addEventListener(
            'keydown',
            (event) => {

                if (event.key === 'Enter') {

                    sendMessage();

                }

            }
        );



        // ==========================================
        // SEND MESSAGE
        // ==========================================

        function sendMessage() {

            const message =
                messageInput.value.trim();


            /*
             * Don't send empty message
             */

            if (!message) {
                return;
            }


            /*
             * User must join room first
             */

            if (!isJoined) {

                addSystemMessage(
                    'You must join the room first.'
                );

                return;

            }


            /*
             * Send message to server
             */

            socket.emit(
                'send_message',
                {
                    roomId: currentRoom,
                    message: message
                }
            );


            /*
             * Clear input
             */

            messageInput.value = '';


            /*
             * Focus input again
             */

            messageInput.focus();

        }



        // ==========================================
        // RECEIVE NEW MESSAGE
        // ==========================================

        socket.on(
            'new_message',
            (data) => {

                /*
                 * Only display message if
                 * it belongs to current room.
                 */

                if (
                    data.roomId !== currentRoom
                ) {
                    return;
                }


                addMessage(data);

            }
        );



        // ==========================================
        // DISPLAY MESSAGE
        // ==========================================

        function addMessage(data) {

            const messageElement =
                document.createElement('div');


            messageElement.className =
                'message';


            const senderElement =
                document.createElement('div');


            senderElement.className =
                'sender';


            senderElement.textContent =
                data.senderId;


            const textElement =
                document.createElement('div');


            textElement.className =
                'text';


            textElement.textContent =
                data.message;


            messageElement.appendChild(
                senderElement
            );


            messageElement.appendChild(
                textElement
            );


            messagesElement.appendChild(
                messageElement
            );


            /*
             * Automatically scroll to
             * latest message
             */

            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        }



        // ==========================================
        // DISPLAY SYSTEM MESSAGE
        // ==========================================

        function addSystemMessage(message) {

            const element =
                document.createElement('div');


            element.className =
                'system-message';


            element.textContent =
                message;


            messagesElement.appendChild(
                element
            );


            messagesElement.scrollTop =
                messagesElement.scrollHeight;

        }


    </script>


</body>

</html>
