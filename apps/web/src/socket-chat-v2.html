<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #eef0f4;
            --sidebar-bg: #1a1c2b;
            --sidebar-bg-2: #22253a;
            --accent: #6366f1;
            --accent-dark: #4f46e5;
            --text-dark: #18181b;
            --text-muted: #71717a;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 20px;
        }

        .top-nav {
            width: 960px;
            max-width: 100%;
            padding: 0 4px;
        }

        .home-link {
            font-size: 13px;
            color: #71717a;
            text-decoration: none;
            font-weight: 500;
        }

        .home-link:hover {
            color: #18181b;
            text-decoration: underline;
        }

        /* ---- Auth card ---- */
        .auth-card {
            width: 960px;
            max-width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .auth-card .label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .auth-card input {
            flex: 1;
            padding: 11px 14px;
            border: 1.5px solid #e4e4e7;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }

        .auth-card input:focus {
            border-color: var(--accent);
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 11px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity .15s, transform .1s;
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        /* ---- Chat shell ---- */
        .chat-app {
            width: 960px;
            height: 640px;
            max-width: 100%;
            display: flex;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .14);
        }

        .sidebar {
            width: 270px;
            background: linear-gradient(180deg, var(--sidebar-bg), var(--sidebar-bg-2));
            color: #fff;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
        }

        .brand h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: #a1a1aa;
            background: rgba(255, 255, 255, .06);
            padding: 6px 10px;
            border-radius: 20px;
            margin-bottom: 26px;
            width: fit-content;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #71717a;
        }

        .status-pill.connected .status-dot {
            background: var(--success);
            box-shadow: 0 0 6px var(--success);
        }

        .status-pill.connected {
            color: #bbf7d0;
        }

        .status-pill.error .status-dot {
            background: var(--danger);
        }

        .status-pill.error {
            color: #fecaca;
        }

        .rooms-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #71717a;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .rooms {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #d4d4d8;
            font-size: 14px;
            transition: background .12s;
        }

        .room:hover {
            background: rgba(255, 255, 255, .06);
        }

        .room.active {
            background: var(--accent);
            color: #fff;
        }

        .room .hash {
            opacity: .6;
            font-weight: 600;
        }

        .room.active .hash {
            opacity: .85;
        }

        .online-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .online-list .empty-hint {
            font-size: 12.5px;
            color: #52525b;
            padding: 4px 2px;
        }

        .participant {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 13px;
            color: #d4d4d8;
        }

        .participant .p-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #52525b;
            flex-shrink: 0;
        }

        .participant.online .p-dot {
            background: var(--success);
            box-shadow: 0 0 5px var(--success);
        }

        /* ---- Main chat panel ---- */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            height: 68px;
            border-bottom: 1px solid #ececef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        .chat-header h3 {
            font-size: 16.5px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .chat-header .sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .room-actions {
            display: flex;
            gap: 8px;
        }

        .btn-ghost {
            background: #f4f4f5;
            color: var(--text-dark);
        }

        .btn-ghost:hover:not(:disabled) {
            background: #e4e4e7;
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 13px;
        }

        .messages {
            flex: 1;
            padding: 22px 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafb;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d4d4d8;
            border-radius: 3px;
        }

        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 65%;
            align-self: flex-start;
        }

        .msg-row.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-row.own .avatar {
            display: none;
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .bubble-wrap {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 100%;
        }

        .msg-row.own .bubble-wrap {
            align-items: flex-end;
        }

        .sender-name {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--accent);
            padding: 0 4px;
        }

        .msg-row.own .sender-name {
            display: none;
        }

        .bubble {
            padding: 8px 12px;
            border-radius: 16px;
            background: #fff;
            color: var(--text-dark);
            font-size: 14.5px;
            line-height: 1.4;
            word-break: break-word;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 1px rgba(0, 0, 0, .06);
        }

        .msg-row.own .bubble {
            background: var(--accent);
            color: #fff;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 10.5px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .msg-row.own .msg-time {
            text-align: right;
        }

        .system-message {
            align-self: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 4px 12px;
            background: #f0f0f2;
            border-radius: 20px;
        }

        .system-message.error {
            color: #b91c1c;
            background: #fee2e2;
            font-weight: 600;
        }

        .message-form {
            height: 76px;
            border-top: 1px solid #ececef;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 20px;
            flex-shrink: 0;
        }

        .message-input {
            flex: 1;
            height: 44px;
            border: 1.5px solid #e4e4e7;
            border-radius: 22px;
            padding: 0 18px;
            outline: none;
            font-size: 14px;
            transition: border-color .15s;
        }

        .message-input:focus {
            border-color: var(--accent);
        }

        .message-input:disabled {
            background: #fafafa;
            color: #a1a1aa;
        }

        .send-btn {
            height: 44px;
            width: 44px;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            font-size: 16px;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-dark);
        }

        @media(max-width:1000px) {

            .chat-app,
            .auth-card {
                width: 100%;
            }

            .chat-app {
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                width: 200px;
                padding: 18px 12px;
            }

            .msg-row {
                max-width: 85%;
            }
        }
    </style>
</head>
<script src="auth.js"></script>

<body>
    <div class="top-nav">
        <a href="index.html" class="home-link">← NewsHub</a>
    </div>

    <div class="auth-card">
        <input type="text" id="tokenInput" placeholder="Paste JWT token here">
        <button id="connectButton" class="btn btn-primary" type="button">Connect</button>
    </div>

    <div class="chat-app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">C</div>
                <h2>Group Chat</h2>
            </div>

            <div id="connectionStatus" class="status-pill">
                <span class="status-dot"></span>
                <span class="status-text">Disconnected</span>
            </div>

            <div class="rooms-title">Rooms</div>
            <div id="rooms" class="rooms">
                <div class="room" data-room="developers"><span class="hash">#</span>developers</div>
                <div class="room" data-room="testing"><span class="hash">#</span>testing</div>
                <div class="room active" data-room="general"><span class="hash">#</span>general</div>
            </div>

            <div class="rooms-title" style="margin-top: 22px;">Online</div>
            <div id="onlineUsers" class="online-list">
                <div class="empty-hint">No one else online yet</div>
            </div>
        </aside>

        <main class="chat">
            <header class="chat-header">
                <div>
                    <h3>#<span id="currentRoom">general</span></h3>
                    <div class="sub" id="roomSub">Not joined</div>
                </div>
                <div class="room-actions">
                    <button id="joinButton" class="btn btn-ghost btn-sm" type="button">Join</button>
                    <button id="leaveButton" class="btn btn-ghost btn-sm" type="button">Leave</button>
                </div>
            </header>

            <section id="messages" class="messages">
                <div class="system-message">Paste a token and click Connect to start.</div>
            </section>

            <form id="messageForm" class="message-form">
                <input type="text" id="messageInput" class="message-input" placeholder="Type a message..."
                    autocomplete="off" disabled>
                <button type="submit" id="sendButton" class="send-btn" disabled>➤</button>
            </form>
        </main>
    </div>

    <script src="http://localhost:3100/socket.io/socket.io.js"></script>
    <script>
        requireAuth();

        let socket = null;
        let currentUserId = null;
        let currentRoom = "general";
        let isJoined = false;
        let pendingRoom = null;
        let onlineUsersMap = {};

        const connectionStatus = document.getElementById("connectionStatus");
        const statusText = connectionStatus.querySelector(".status-text");
        const currentRoomElement = document.getElementById("currentRoom");
        const roomSub = document.getElementById("roomSub");
        const messagesContainer = document.getElementById("messages");
        const messageInput = document.getElementById("messageInput");
        const joinButton = document.getElementById("joinButton");
        const leaveButton = document.getElementById("leaveButton");
        const sendButton = document.getElementById("sendButton");
        const messageForm = document.getElementById("messageForm");
        const tokenInput = document.getElementById("tokenInput");
        const connectButton = document.getElementById("connectButton");

        // ---- Connection lifecycle ----

        // Decode a JWT's payload client-side (no signature check — just reading the claims
        // we already trust because we're the ones who received this token from login).
        function decodeJwtPayload(token) {
            try {
                const base64Url = token.split(".")[1];
                const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
                const json = decodeURIComponent(
                    atob(base64)
                        .split("")
                        .map(c => "%" + c.charCodeAt(0).toString(16).padStart(2, "0"))
                        .join("")
                );
                return JSON.parse(json);
            } catch {
                return null;
            }
        }

        function connectSocket() {
            const token = getToken();
            const payload = decodeJwtPayload(token);

            console.log(payload);
            console.log(decodeJwtPayload(getToken()));
            if (!payload || !payload.id) {
                addSystemMessage("Could not read a valid user id from your session. Please sign in again.", true);
                return;
            }

            currentUserId = payload.sub;

            socket = io("http://localhost:3100", {
                auth: { token },
            });

            wireSocketEvents();
        }

        function setStatus(text, mode) {
            statusText.textContent = text;
            connectionStatus.className = "status-pill" + (mode ? " " + mode : "");
        }

        function wireSocketEvents() {
            socket.on("connect", () => {
                // currentUserId was already set from the decoded token before connecting —
                // do NOT overwrite it with socket.id here, since socket.id never matches
                // the senderId the backend broadcasts.
                setStatus("Connected", "connected");
                addSystemMessage("Connected to server.");
                joinCurrentRoom();
            });

            socket.on("auth_error", (data) => {
                setStatus("Auth failed", "error");
                addSystemMessage(`Authentication failed: ${data.message}`, true);
            });

            socket.on("connect_error", (err) => {
                setStatus("Connection error", "error");
                addSystemMessage(`Connection error: ${err.message}`, true);
            });

            socket.on("disconnect", () => {
                currentUserId = null;
                isJoined = false;
                pendingRoom = null;
                setStatus("Disconnected");
                roomSub.textContent = "Not joined";
                addSystemMessage("Disconnected.");
                updateButtons();
                onlineUsersMap = {};
                renderOnlineUsers();
            });

            socket.on("room_joined", (data) => {
                isJoined = true;
                currentRoom = data.roomId;
                currentRoomElement.textContent = currentRoom;
                roomSub.textContent = "Joined";
                updateActiveRoom();
                clearMessages();
                addSystemMessage(`You joined #${currentRoom}`);
                updateButtons();
            });

            socket.on("room_left", (data) => {
                isJoined = false;
                roomSub.textContent = "Not joined";
                addSystemMessage(`You left #${data.roomId}`);
                updateButtons();

                if (pendingRoom) {
                    currentRoom = pendingRoom;
                    pendingRoom = null;
                    currentRoomElement.textContent = currentRoom;
                    updateActiveRoom();
                    clearMessages();
                    joinCurrentRoom();
                }
            });

            socket.on("new_message", (data) => {
                if (data.roomId !== currentRoom) return;
                addMessage(data);
            });

            socket.on("online_users", (data) => {
                data.users.forEach(({ userId, name }) => {
                    onlineUsersMap[userId] = name;
                });
                renderOnlineUsers();
            });

            socket.on("user_online", (data) => {
                onlineUsersMap[data.userId] = data.name;
                renderOnlineUsers();
            });

            socket.on("user_offline", (data) => {
                delete onlineUsersMap[data.userId];
                renderOnlineUsers();
            });

            socket.on("token_expired", () => {
                handleTokenExpired();
            });
        }

        function joinCurrentRoom() {
            if (!socket || !socket.connected || isJoined) return;
            socket.emit("join_room", { roomId: currentRoom });
        }

        // ---- Room UI ----

        joinButton.addEventListener("click", () => {
            joinCurrentRoom();
        });

        leaveButton.addEventListener("click", () => {
            if (!socket || !isJoined) return;
            socket.emit("leave_room", { roomId: currentRoom });
        });

        document.querySelectorAll(".room").forEach(room => {
            room.addEventListener("click", () => {
                if (!socket || !socket.connected) return;

                const newRoom = room.dataset.room;

                if (newRoom === currentRoom && isJoined) return;

                if (isJoined) {
                    pendingRoom = newRoom;
                    socket.emit("leave_room", { roomId: currentRoom });
                    return;
                }

                currentRoom = newRoom;
                currentRoomElement.textContent = currentRoom;
                updateActiveRoom();
                clearMessages();
                joinCurrentRoom();
            });
        });

        async function refreshAccessToken() {
            try {
                const res = await fetch('http://localhost:3100/auth/refresh', {
                    method: 'GET',
                    credentials: 'include', // sends the httpOnly refresh cookie automatically
                });

                if (!res.ok) {
                    return null;
                }

                const data = await res.json();
                const newToken = data.accessToken;
                setToken(newToken, getUserName()); // keep the existing stored name
                return newToken;
            } catch {
                return null;
            }
        }

        async function handleTokenExpired() {
            addSystemMessage("Session refreshing...", false);

            if (socket) {
                socket.removeAllListeners();
                socket.disconnect();
            }

            const newToken = await refreshAccessToken();

            if (!newToken) {
                addSystemMessage("Session expired. Please sign in again.", true);
                setTimeout(() => signOut(), 1500);
                return;
            }

            currentUserId = decodeJwtPayload(newToken)?.sub;

            socket = io("http://localhost:3100", {
                auth: { token: newToken },
            });

            wireSocketEvents();
        }

        function renderOnlineUsers() {
            const container = document.getElementById('onlineUsers');
            const entries = Object.entries(onlineUsersMap).filter(([id]) => id !== currentUserId);

            if (entries.length === 0) {
                container.innerHTML = `<div class="empty-hint">No one else online yet</div>`;
                return;
            }
            container.innerHTML = '';
            entries.forEach(([userId, name]) => {
                const row = document.createElement('div');
                row.classList.add("participant", "online")
                row.innerHTML = `<span class="p-dot"></span><span>${name || userId}</span>`;
                container.appendChild(row)
            })
        }

        function updateActiveRoom() {
            document.querySelectorAll(".room").forEach(room => {
                room.classList.remove("active");
            });

            const activeRoom = document.querySelector(`.room[data-room="${currentRoom}"]`);

            if (activeRoom) {
                activeRoom.classList.add("active");
            }
        }

        // ---- Messages ----

        messageForm.addEventListener("submit", (event) => {
            event.preventDefault();
            sendMessage();
        });

        function sendMessage() {
            if (!socket) return;

            const message = messageInput.value.trim();

            if (!message) return;

            if (!isJoined) {
                addSystemMessage("You must join the room first.", true);
                return;
            }

            socket.emit("send_message", {
                roomId: currentRoom,
                message: message
            });

            messageInput.value = "";
            messageInput.focus();
        }

        function initial(name) {
            return (name || "?").trim().charAt(0).toUpperCase();
        }

        function formatTime() {
            return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        }

        function addMessage(data) {
            const isOwn = data.senderId === currentUserId;
            const displayName = data.senderName || data.senderId;

            const row = document.createElement("div");
            row.classList.add("msg-row");
            if (isOwn) row.classList.add("own");

            const avatar = document.createElement("div");
            avatar.classList.add("avatar");
            avatar.textContent = initial(displayName);

            const wrap = document.createElement("div");
            wrap.classList.add("bubble-wrap");

            const sender = document.createElement("div");
            sender.classList.add("sender-name");
            sender.textContent = displayName;

            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            bubble.textContent = data.message;

            const time = document.createElement("div");
            time.classList.add("msg-time");
            time.textContent = formatTime();

            wrap.appendChild(sender);
            wrap.appendChild(bubble);
            wrap.appendChild(time);
            row.appendChild(avatar);
            row.appendChild(wrap);
            messagesContainer.appendChild(row);

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function addSystemMessage(message, isError) {
            const element = document.createElement("div");
            element.classList.add("system-message");
            if (isError) element.classList.add("error");
            element.textContent = message;
            messagesContainer.appendChild(element);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function clearMessages() {
            messagesContainer.innerHTML = "";
        }

        function updateButtons() {
            const connected = !!(socket && socket.connected);
            joinButton.disabled = isJoined || !connected;
            leaveButton.disabled = !isJoined;
            messageInput.disabled = !isJoined;
            sendButton.disabled = !isJoined;
        }

        updateButtons();
        connectSocket(); 
    </script>
</body>

</html>
