worker_processes 2;
events { worker_connections 1024; }

http {
    log_format bg '$time_iso8601 rid=$http_x_request_id status=$status '
                  'upstream=$upstream_addr urt=$upstream_response_time '
                  'rt=$request_time';
    access_log /dev/stdout bg;
    error_log  /dev/stderr warn;

    include /etc/nginx/conf.d/active_upstream.conf;

    server {
        listen 80;

        location = /nginx_status {
            stub_status;
        }

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # required for upstream keepalive
            proxy_set_header X-Request-Id $http_x_request_id;
            proxy_next_upstream off;                 # no retry on the other server
        }
    }
}