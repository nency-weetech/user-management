services:
  postgres:
    image: postgres:16-alpine
    container_name: user_mngmt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - chat_pg_data:/var/lib/postgresql/data

volumes:
  chat_pg_data: